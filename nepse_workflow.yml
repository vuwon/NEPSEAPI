name: NEPSE Daily Fetch + Dashboard

on:
  schedule:
    - cron: '30 9 * * 0,1,2,3,4'
    # 3:15 PM Nepal Time (NPT = UTC+5:45) = 09:30 UTC
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fetch-and-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pandas openpyxl
        timeout-minutes: 5

      # ── Check NEPSE holiday ───────────────────────────────────────────
      - name: Check NEPSE holiday
        id: holiday
        run: |
          python - <<'EOF'
          import datetime, os

          HOLIDAYS = [
              "2026-01-11", "2026-01-14", "2026-02-19", "2026-03-28",
              "2026-04-14", "2026-05-01", "2026-05-12", "2026-09-17",
              "2026-10-02", "2026-10-20", "2026-10-21", "2026-10-22",
              "2026-10-23", "2026-11-15", "2026-11-16", "2026-11-17",
              "2026-12-29",
          ]
          today = datetime.date.today().strftime("%Y-%m-%d")
          is_holiday = today in HOLIDAYS
          print(f"Today: {today} | Holiday: {is_holiday}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"is_holiday={'true' if is_holiday else 'false'}\n")
              f.write(f"today={today}\n")
          EOF

      # ── Fetch today's data ────────────────────────────────────────────
      - name: Fetch NEPSE floorsheet data
        if: steps.holiday.outputs.is_holiday == 'false'
        run: python -u Nepse_API.py
        timeout-minutes: 25

      # ── Compile holdings from today's Excel only ──────────────────────
      # We do NOT store Excel in GitHub — only the aggregated JSON
      - name: Compile holdings and generate dashboard
        if: steps.holiday.outputs.is_holiday == 'false'
        run: |
          mkdir -p data
          # Move today's Excel into data/ for compile_holdings.py to read
          for f in Combined_selected_symbols_*.xlsx; do
            [ -f "$f" ] && mv "$f" data/ && echo "Moved: $f" || true
          done
          python -u compile_holdings.py
        timeout-minutes: 15

      # ── Commit ONLY JSON + HTML — never Excel files ───────────────────
      - name: Commit dashboard to repo
        if: steps.holiday.outputs.is_holiday == 'false'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage ONLY the dashboard files — never the Excel files
          git add holdings_summary.json index.html

          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "NEPSE dashboard update ${{ steps.holiday.outputs.today }}"
            git push
            echo "✅ Committed and pushed!"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Send daily email ──────────────────────────────────────────────
      - name: Send daily email summary
        if: steps.holiday.outputs.is_holiday == 'false'
        run: |
          python - <<'EOF'
          import os, json, smtplib
          from email.mime.multipart import MIMEMultipart
          from email.mime.text import MIMEText
          from datetime import date

          # *** CHANGE THESE ***
          RECIPIENTS = [
              "thebhuwan@gmail.com",
              "cmcchovar@gmail.com",
              "rajkarnikarm@gmail.com",
          ]

          SENDER       = os.environ["GMAIL_ADDRESS"]
          APP_PASSWORD = os.environ["GMAIL_APP_PASSWORD"]
          TODAY        = date.today().strftime("%Y-%m-%d")
          REPO         = os.environ.get("GITHUB_REPOSITORY","")
          PAGES_URL    = f"https://{REPO.split('/')[0]}.github.io/{REPO.split('/')[1]}/"
          RUN_URL      = f"https://github.com/{REPO}/actions/runs/{os.environ.get('GITHUB_RUN_ID','')}"

          try:
              with open("holdings_summary.json") as f:
                  data = json.load(f)
              holdings   = data.get("h", [])
              today_recs = [r for r in holdings if r.get("d")==TODAY]
              top10      = sorted(today_recs, key=lambda x: x.get("hq",0), reverse=True)[:10]
              table_rows = ""
              for r in top10:
                  nh    = int(r.get("hq",0))
                  color = "#00e5a0" if nh>=0 else "#ff4d6a"
                  table_rows += f"""<tr>
                    <td style='padding:8px;border:1px solid #1f2d45;font-family:monospace;color:#00c8ff'>{r.get('s','')}</td>
                    <td style='padding:8px;border:1px solid #1f2d45;text-align:center;font-family:monospace'>{r.get('b','')}</td>
                    <td style='padding:8px;border:1px solid #1f2d45;font-size:12px;color:#64748b'>{r.get('bn','')}</td>
                    <td style='padding:8px;border:1px solid #1f2d45;text-align:right;color:{color};font-family:monospace'>{nh:,}</td>
                  </tr>"""
              total_recs = len(today_recs)
              unique_sym = len(set(r.get("s") for r in today_recs))
          except Exception as e:
              table_rows = f"<tr><td colspan='4' style='padding:12px;color:#64748b'>Summary unavailable: {e}</td></tr>"
              total_recs = "—"; unique_sym = "—"

          html = f"""<html><body style='background:#0a0f1e;color:#e2e8f0;font-family:sans-serif;padding:24px;margin:0'>
          <div style='max-width:600px;margin:0 auto'>
            <h2 style='color:#00c8ff;font-family:monospace'>NEPSE Holdings — {TODAY}</h2>
            <p style='color:#64748b;font-size:13px;margin-bottom:20px'>Automated daily floorsheet analysis</p>
            <div style='display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap'>
              <div style='background:#111827;border:1px solid #1f2d45;border-radius:8px;padding:14px 18px;flex:1;min-width:120px'>
                <div style='color:#64748b;font-size:11px;text-transform:uppercase;letter-spacing:1px'>Today Positions</div>
                <div style='color:#00c8ff;font-size:22px;font-family:monospace;margin-top:4px'>{total_recs:,}</div>
              </div>
              <div style='background:#111827;border:1px solid #1f2d45;border-radius:8px;padding:14px 18px;flex:1;min-width:120px'>
                <div style='color:#64748b;font-size:11px;text-transform:uppercase;letter-spacing:1px'>Unique Stocks</div>
                <div style='color:#00c8ff;font-size:22px;font-family:monospace;margin-top:4px'>{unique_sym}</div>
              </div>
            </div>
            <h3 style='color:#cdd9e5;margin-bottom:10px;font-size:13px;text-transform:uppercase;letter-spacing:1px'>Top 10 Holdings Today</h3>
            <table style='width:100%;border-collapse:collapse;background:#111827;border-radius:8px;overflow:hidden;margin-bottom:20px'>
              <thead><tr style='background:#1a2235'>
                <th style='padding:9px;border:1px solid #1f2d45;text-align:left;color:#64748b;font-size:11px'>SYMBOL</th>
                <th style='padding:9px;border:1px solid #1f2d45;color:#64748b;font-size:11px'>BROKER #</th>
                <th style='padding:9px;border:1px solid #1f2d45;text-align:left;color:#64748b;font-size:11px'>BROKER NAME</th>
                <th style='padding:9px;border:1px solid #1f2d45;text-align:right;color:#64748b;font-size:11px'>NET HOLDING</th>
              </tr></thead>
              <tbody>{table_rows}</tbody>
            </table>
            <a href='{PAGES_URL}' style='display:inline-block;background:linear-gradient(135deg,#0090c8,#a855f7);color:#fff;padding:10px 20px;border-radius:7px;text-decoration:none;font-size:13px;font-weight:500'>
              View Full Dashboard →
            </a>
            <p style='margin-top:16px;color:#4a6480;font-size:11px'>
              Run log: <a href='{RUN_URL}' style='color:#00c8ff'>{RUN_URL}</a>
            </p>
          </div></body></html>"""

          msg = MIMEMultipart("alternative")
          msg["From"]    = SENDER
          msg["To"]      = ", ".join(RECIPIENTS)
          msg["Subject"] = f"NEPSE Holdings Report — {TODAY}"
          msg.attach(MIMEText(html, "html"))
          with smtplib.SMTP_SSL("smtp.gmail.com", 465) as s:
              s.login(SENDER, APP_PASSWORD)
              s.sendmail(SENDER, RECIPIENTS, msg.as_string())
          print(f"✅ Email sent to {len(RECIPIENTS)} recipient(s)")
          EOF
        env:
          GMAIL_ADDRESS:      ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}

      # ── Failure notification ──────────────────────────────────────────
      - name: Notify on failure
        if: failure()
        run: |
          python - <<'EOF'
          import os, smtplib
          from email.mime.text import MIMEText
          from datetime import date

          RECIPIENTS   = ["yourname@gmail.com"]  # *** CHANGE THIS ***
          SENDER       = os.environ.get("GMAIL_ADDRESS","")
          APP_PASSWORD = os.environ.get("GMAIL_APP_PASSWORD","")
          if not SENDER: exit(0)

          TODAY   = date.today().strftime("%Y-%m-%d")
          REPO    = os.environ.get("GITHUB_REPOSITORY","")
          RUN_URL = f"https://github.com/{REPO}/actions/runs/{os.environ.get('GITHUB_RUN_ID','')}"

          msg = MIMEText(f"NEPSE workflow FAILED on {TODAY}.\n\nCheck logs:\n{RUN_URL}")
          msg["From"]    = SENDER
          msg["To"]      = ", ".join(RECIPIENTS)
          msg["Subject"] = f"⚠️ NEPSE Workflow Failed — {TODAY}"
          try:
              with smtplib.SMTP_SSL("smtp.gmail.com", 465) as s:
                  s.login(SENDER, APP_PASSWORD)
                  s.sendmail(SENDER, RECIPIENTS, msg.as_string())
          except Exception as e:
              print(f"Could not send failure email: {e}")
          EOF
        env:
          GMAIL_ADDRESS:      ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
